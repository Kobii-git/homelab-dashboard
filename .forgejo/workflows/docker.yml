name: Build and publish Docker image

on:
  push:
    branches:
      - main
      - beta
    tags:
      - "v*"

env:
  REGISTRY: 10.0.21.40:3000
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: docker
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build app
        run: npm run build

      - name: Browser and accessibility tests
        run: |
          npx playwright install --with-deps chromium
          npx playwright test

      - name: Dependency audits
        run: |
          npm run audit:production
          npm run audit:all

      - name: Production startup smoke
        run: |
          set -euo pipefail
          export NODE_ENV=production
          export DATABASE_URL="file:../data/ci-smoke-${GITHUB_RUN_ID}.db"
          export ADMIN_PASSWORD=ci-admin-password
          export COOKIE_SECRET=ci-cookie-secret-with-more-than-32-characters
          export HOST=127.0.0.1
          export PORT=4173
          npx prisma db push --skip-generate
          node dist/server/index.js >/tmp/homelab-dashboard.log 2>&1 &
          server_pid=$!
          trap 'kill ${server_pid} 2>/dev/null || true' EXIT
          for attempt in $(seq 1 20); do
            curl -fsS http://127.0.0.1:4173/api/health && exit 0
            sleep 1
          done
          cat /tmp/homelab-dashboard.log
          exit 1

      - name: Container smoke
        run: |
          set -euo pipefail
          docker build -t homelab-dashboard-ci .
          volume="homelab-dashboard-ci-${GITHUB_RUN_ID}"
          container="homelab-dashboard-ci-${GITHUB_RUN_ID}"
          docker volume create "${volume}"
          trap 'docker rm -f "${container}" 2>/dev/null || true; docker volume rm "${volume}" 2>/dev/null || true' EXIT
          docker run -d --name "${container}" --read-only --tmpfs /tmp:size=64m,mode=1777 --cap-drop ALL --security-opt no-new-privileges \
            -e ADMIN_PASSWORD=ci-admin-password -e COOKIE_SECRET=ci-cookie-secret-with-more-than-32-characters \
            -p 4174:4173 -v "${volume}:/data" homelab-dashboard-ci
          test "$(docker inspect --format '{{.Config.User}}' "${container}")" = node
          for attempt in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4174/api/health && exit 0
            sleep 1
          done
          docker logs "${container}"
          exit 1

      - name: Log in to Forgejo Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.FORGEJO_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=beta,enable=${{ github.ref == 'refs/heads/beta' }}
            type=sha,prefix=sha-,format=short
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_GIT_SHA=${{ github.sha }}
            APP_BUILD_TIME=${{ github.event.head_commit.timestamp }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
