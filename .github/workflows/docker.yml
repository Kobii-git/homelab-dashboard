name: Build and publish Docker image

on:
  push:
    branches:
      - main
      - beta
    tags:
      - "v*"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  GITLEAKS_IMAGE: zricethezav/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
  TRIVY_IMAGE: aquasec/trivy@sha256:cffe3f5161a47a6823fbd23d985795b3ed72a4c806da4c4df16266c02accdd6f
  SYFT_IMAGE: anchore/syft@sha256:13b53ebabe3d215268c90cf8fb9b875f0183908245f376fd4b3a2cb69d21d484
  ZAP_IMAGE: ghcr.io/zaproxy/zaproxy@sha256:8d387b1a63e3425beef4846e39719f5af2a787753af2d8b6558c6257d7a577a2
  COSIGN_IMAGE: gcr.io/projectsigstore/cosign@sha256:71b96f6405dd3c3f081ebf73099f18edac7a716699398660890a86c42bf5edfd

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Normalize registry image name
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify dependency notices
        run: npm run licenses:check

      - name: Reject stale duplicate files
        run: npm run check:stale-files

      - name: Secret scan
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo "$GITLEAKS_IMAGE" git --redact
          docker run --rm -v "$PWD:/repo" -w /repo "$GITLEAKS_IMAGE" dir --redact .

      - name: Filesystem and Dockerfile scan
        run: docker run --rm -v "$PWD:/repo" "$TRIVY_IMAGE" fs --scanners vuln,secret,misconfig --severity HIGH,CRITICAL --exit-code 1 /repo

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build app
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser and accessibility tests
        run: npx playwright test

      - name: Audit production dependencies
        run: npm run audit:production

      - name: Audit full dependency tree
        run: npm run audit:all

      - name: Production startup smoke
        run: |
          set -euo pipefail
          export NODE_ENV=production
          export DATABASE_URL="file:../data/ci-smoke-${GITHUB_RUN_ID}.db"
          export ADMIN_PASSWORD="ci-admin-password"
          export COOKIE_SECRET="ci-cookie-secret-with-more-than-32-characters"
          export APP_ORIGIN="https://dashboard.test"
          export TRUST_PROXY_CIDRS="127.0.0.1/32"
          export OUTBOUND_ALLOWED_CIDRS="10.0.0.0/8"
          export HOST=127.0.0.1
          export PORT=4173
          npx prisma db push --skip-generate
          node dist/server/index.js > /tmp/homelab-dashboard.log 2>&1 &
          server_pid=$!
          trap 'kill ${server_pid} 2>/dev/null || true' EXIT
          for _ in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:4173/api/health; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/homelab-dashboard.log
          exit 1

      - name: Non-root read-only container smoke
        run: |
          set -euo pipefail
          docker build -t homelab-dashboard-ci .
          volume="homelab-dashboard-ci-${GITHUB_RUN_ID}"
          container="homelab-dashboard-ci-${GITHUB_RUN_ID}"
          docker volume create "${volume}"
          trap 'docker rm -f "${container}" 2>/dev/null || true; docker volume rm "${volume}" 2>/dev/null || true' EXIT
          docker run -d --name "${container}" --read-only --tmpfs /tmp:size=64m,mode=1777 --cap-drop ALL --security-opt no-new-privileges \
            -e ADMIN_PASSWORD=ci-admin-password -e COOKIE_SECRET=ci-cookie-secret-with-more-than-32-characters \
            -e APP_ORIGIN=https://dashboard.test -e TRUST_PROXY_CIDRS=127.0.0.1/32 \
            -e OUTBOUND_ALLOWED_CIDRS=10.0.0.0/8 \
            -p 4174:4173 -v "${volume}:/data" homelab-dashboard-ci
          test "$(docker inspect --format '{{.Config.User}}' "${container}")" = "node"
          for _ in $(seq 1 30); do
            if test "$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{end}}' "${container}")" = "healthy"; then
              exit 0
            fi
            sleep 1
          done
          docker logs "${container}"
          exit 1

      - name: Scan final runtime image
        run: docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE" image --severity HIGH,CRITICAL --exit-code 1 homelab-dashboard-ci

      - name: Generate SBOM
        run: |
          mkdir -p security-artifacts
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/security-artifacts:/out" \
            "$SYFT_IMAGE" homelab-dashboard-ci -o spdx-json=/out/homelab-dashboard.spdx.json
          docker run --rm -v "$PWD/security-artifacts:/out:ro" "$TRIVY_IMAGE" sbom \
            --severity HIGH,CRITICAL --exit-code 1 /out/homelab-dashboard.spdx.json

      - name: Unauthenticated and authenticated web baseline
        run: |
          set -euo pipefail
          target="homelab-dashboard-zap-${GITHUB_RUN_ID}"
          docker run -d --name "${target}" -e NODE_ENV=test -e ADMIN_PASSWORD=ci-admin-password \
            -e COOKIE_SECRET=ci-cookie-secret-with-more-than-32-characters -p 4175:4173 homelab-dashboard-ci
          trap 'docker rm -f "${target}" 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4175/api/health && break
            sleep 1
          done
          docker run --rm --network host "$ZAP_IMAGE" zap-baseline.py -t http://127.0.0.1:4175 -m 2 -I
          cookie="$(curl -fsS -D - -o /dev/null -H 'Content-Type: application/json' \
            --data '{"password":"ci-admin-password"}' http://127.0.0.1:4175/api/auth/login \
            | awk 'BEGIN{IGNORECASE=1} /^set-cookie: homelab_session=/{print $2}' | tr -d '\r' | cut -d';' -f1)"
          test -n "${cookie}"
          docker run --rm --network host "$ZAP_IMAGE" zap-baseline.py -t http://127.0.0.1:4175 -m 2 -I \
            -z "-config replacer.full_list(0).description=auth -config replacer.full_list(0).enabled=true -config replacer.full_list(0).matchtype=REQ_HEADER -config replacer.full_list(0).matchstr=Cookie -config replacer.full_list(0).regex=false -config replacer.full_list(0).replacement=${cookie}"

  build-and-push:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout validated source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Normalize registry image name
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=beta,enable=${{ github.ref == 'refs/heads/beta' }}
            type=sha,prefix=sha-,format=short

      - name: Set up ARM64 emulation
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          platforms: arm64
          image: tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build and push
        id: build
        env:
          # Keep source/material provenance; omit event payloads and personal commit metadata.
          BUILDX_METADATA_PROVENANCE: min
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_GIT_SHA=${{ github.sha }}
            APP_BUILD_TIME=${{ github.event.head_commit.timestamp }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: mode=min

      - name: Scan pushed image digest
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="${REGISTRY}/${IMAGE_NAME}@${{ steps.build.outputs.digest }}"
          set -euo pipefail
          for platform in linux/amd64 linux/arm64; do
            docker run --rm -e TRIVY_USERNAME -e TRIVY_PASSWORD "$TRIVY_IMAGE" image \
              --image-src remote --platform "${platform}" --severity HIGH,CRITICAL --exit-code 1 "${image}"
          done

      - name: Sign and verify image digest with GitHub identity
        run: |
          set -euo pipefail
          image="${REGISTRY}/${IMAGE_NAME}@${{ steps.build.outputs.digest }}"
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -e DOCKER_CONFIG=/docker \
            -e GITHUB_ACTIONS=true \
            -e ACTIONS_ID_TOKEN_REQUEST_URL -e ACTIONS_ID_TOKEN_REQUEST_TOKEN \
            -v "${HOME}/.docker:/docker:ro" "$COSIGN_IMAGE" \
            sign --yes "${image}"
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -e DOCKER_CONFIG=/docker \
            -v "${HOME}/.docker:/docker:ro" "$COSIGN_IMAGE" \
            verify --certificate-identity "${GITHUB_SERVER_URL}/${GITHUB_WORKFLOW_REF}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com "${image}"
