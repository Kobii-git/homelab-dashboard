services:
  dashboard-data-init:
    image: ${HOMELAB_IMAGE:-ghcr.io/kobii-git/homelab-dashboard:latest}
    user: "0:0"
    entrypoint: ["/bin/sh", "-eu", "-c"]
    command:
      - |
        find /data \( -type d -o -type f \) \( ! -user node -o ! -group node \) -exec chown node:node {} +
        find /data -type d ! -perm 700 -exec chmod 700 {} +
        find /data -type f ! -perm 600 -exec chmod 600 {} +
    network_mode: none
    volumes:
      - homelab-dashboard-data:/data
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    security_opt:
      - no-new-privileges:true
    restart: "no"
  dashboard:
    image: ${HOMELAB_IMAGE:-ghcr.io/kobii-git/homelab-dashboard:latest}
    container_name: homelab-dashboard
    restart: unless-stopped
    init: true
    depends_on:
      dashboard-data-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: file:/data/homelab.db
      APP_ORIGIN: ${APP_ORIGIN:?Set APP_ORIGIN to the exact URL used in the browser}
      COOKIE_SECRET: ${COOKIE_SECRET:?Set COOKIE_SECRET to at least 32 random characters}
      OUTBOUND_ALLOWED_CIDRS: ${OUTBOUND_ALLOWED_CIDRS:?Set the monitored network CIDRs}
      OUTBOUND_ALLOWED_HOSTS: ${OUTBOUND_ALLOWED_HOSTS:-}
      TRUST_PROXY_CIDRS: ${TRUST_PROXY_CIDRS:-}
      DIRECT_HTTP_LAN: ${DIRECT_HTTP_LAN:-false}
      DASHBOARD_BIND_IP: ${DASHBOARD_BIND_IP:-127.0.0.1}
      SESSION_MAX_AGE_HOURS: ${SESSION_MAX_AGE_HOURS:-168}
      PUBLIC_STATUS_MODE: ${PUBLIC_STATUS_MODE:-disabled}
      ALLOW_INSECURE_INTEGRATIONS: ${ALLOW_INSECURE_INTEGRATIONS:-false}
      SETUP_CODE: ${SETUP_CODE:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      NODE_EXTRA_CA_CERTS: ${NODE_EXTRA_CA_CERTS:-}
      # Optional account override:
      # Set ADMIN_PASSWORD in the environment to skip database-backed account creation.
      # Optional read-only OPNsense integration:
      # OPNSENSE_ENABLED: "true"
      # OPNSENSE_NAME: OPNsense
      # OPNSENSE_BASE_URL: https://opnsense.local
      # OPNSENSE_API_KEY: your-api-key
      # OPNSENSE_API_SECRET: your-api-secret
      # OPNSENSE_TLS_VERIFY: "true"
      # OPNSENSE_POLL_INTERVAL_SECONDS: "60"
      # GOOGLE_CLIENT_ID: your-google-client-id
      # GOOGLE_CLIENT_SECRET: your-google-client-secret
      # GOOGLE_REFRESH_TOKEN: your-google-refresh-token
      # GOOGLE_CALENDAR_IDS: primary
      # TODOIST_API_TOKEN: your-todoist-token
      # TMDB_BEARER_TOKEN: your-tmdb-read-token
      # TRUENAS_ENABLED: "true"
      # TRUENAS_NAME: TrueNAS
      # TRUENAS_BASE_URL: https://truenas.local
      # TRUENAS_USERNAME: dashboard-reader
      # TRUENAS_API_KEY: your-truenas-api-key
      # TRUENAS_POOL: tank
      # TRUENAS_MEDIA_DATASET: tank/media
      # TRUENAS_TLS_VERIFY: "true"
      # TRUENAS_POLL_INTERVAL_SECONDS: "60"
      # Optional AI Command Briefing:
      # AI_ENABLED: "true"
      # AI_PROVIDER_NAME: AI
      # AI_BASE_URL: https://api.openai.com/v1
      # AI_API_KEY: your-ai-api-key
      # AI_MODEL: your-model
      # AI_TLS_VERIFY: "true"
      # AI_BRIEFING_INTERVAL_SECONDS: "21600"
      # AI_INCLUDE_TARGETS: "false"
      # Optional API widget secrets, referenced by widget config:
      # API_WIDGET_SECRET_ALLOWLIST: MY_CUSTOM_WIDGET_TOKEN
      # PLEX_TOKEN: your-plex-token
      # RADARR_API_KEY: your-radarr-api-key
      # HOME_ASSISTANT_TOKEN: your-long-lived-token
      # SONARR_API_KEY: your-api-key
    ports:
      - "${DASHBOARD_BIND_IP:-127.0.0.1}:4173:4173"
    volumes:
      - homelab-dashboard-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

volumes:
  homelab-dashboard-data:
